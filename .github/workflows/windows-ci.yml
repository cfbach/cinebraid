name: CineBraid Windows CI

# Windows is CineBraid's primary supported desktop platform, so the baseline gate
# runs the deterministic, CI-safe suites on a GitHub-hosted Windows runner.
#
# Pull requests targeting main are the only automatic trigger. There is deliberately
# no `push` trigger for main: the merge commit would otherwise re-run the identical
# validation that already passed on the pull request.
#
# This is a public repository and pull requests may come from forks. Every job
# runs on a standard GitHub-hosted runner, reads no secret and holds a read-only
# token, so untrusted pull-request code never reaches a persistent machine or a
# credential. There is no pull_request_target trigger, and there must never be one.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# The job only ever reads the repository. It never publishes, comments or deploys,
# and it never reads a repository secret.
permissions:
  contents: read

# A new push to the same pull request supersedes the previous run.
concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    # This name is the branch-protection status check. Keep it stable.
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 because suites read history: tests/public-exposure.js scans
      # every commit since the audited foundation, and walks the paths main has
      # ever carried. A shallow clone has neither.
      #
      # persist-credentials: false so the job's token is not left in .git/config
      # while pull-request code runs. Nothing in this job pushes.
      - name: Check out the branch under test
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # package.json declares engines.node >= 18 and SETUP.md documents "Node.js 18
      # or newer". Node 18, 20 and 25 are end of life and Node 26 is still Current,
      # so Node 24 (Krypton) is the Active LTS line CineBraid should be validated on.
      - name: Set up Node.js 24 (Active LTS)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # npm ci installs strictly from package-lock.json, which is what a fresh
      # Windows clone does. It also fails if the lockfile and package.json drift.
      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Report the toolchain under test
        run: |
          node --version
          npm --version

      # Every suite below is local-only and deterministic: no provider APIs, no
      # repository secrets, no real browser, and no writes to projects/ or data/.
      #
      # The census runs the exact check:ci chain from package.json, step by step in
      # the same order, but does not stop at the first red step: every step runs, a
      # census listing every failure prints at the end, and the step fails if any
      # suite failed. It stops early only when a suite cannot be launched at all.
      - name: Run every CI-safe validation suite and report each failure
        run: npm run check:ci-census

  # What merging this pull request adds to main's public history.
  #
  # Every push to this repository is already public, so this is not the first
  # moment anything becomes readable - the contributor's local pre-push gate
  # (scripts/push-gate.js, see docs/PUBLICATION.md) is. This job is the check that
  # cannot be skipped: it runs on the server for every pull request, from a fork
  # or not, and main takes nothing that has not passed it.
  #
  # base.sha and head.sha come from the pull_request event, so nothing is
  # inferred. The history range is every file version the pull request adds,
  # including ones deleted again before its tip; the publication tree is the
  # exact `git archive` bytes of the head. Exit 1 is a finding and exit 2 means
  # the scan could not run - both fail the job, because an unanswered question is
  # not a clean answer.
  #
  # It needs no dependencies: scripts/scan-secrets.js uses Node built-ins only.
  publication-scan:
    # This name is intended as a required branch-protection status check.
    # Keep it stable.
    name: Publication scan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out the pull request with its full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24 (Active LTS)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Scan the history and the tree this pull request would add to main
        run: node scripts/scan-secrets.js --history-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --publication-tree ${{ github.event.pull_request.head.sha }}

  # Browser validation runs separately from the required Windows validation job.
  # It is advisory pending BROWSER_GATE_RUNNER_STABILITY_V1. Keep its status name
  # stable, and investigate failures without treating this job as a required
  # branch-protection check during that work.
  #
  # The browser commands remain strict: missing runtime or launch receipts fail
  # the command. Advisory repository policy does not alter those exit codes.
  # The current suite inventory and quarantine are in tests/run-browser-gate.js;
  # see docs/qa/BROWSER_TESTS.md for setup and isolation.
  browser-validation:
    # Keep this advisory status-check name stable.
    name: Browser validation
    runs-on: windows-latest
    # WALL-CLOCK HEADROOM FOR THE JOB, NOT A LOOSER TEST. The gate now runs 56 suites
    # serially, and green jobs took 23 to 30 minutes on hosted runners (one finished 10s
    # under the old 30-minute cap). A green run of PR #82 projects to about 30m14s, so
    # the old cap cancelled green work before check:authority-browser could run. Every
    # suite's own timeouts and assertions are unchanged; only the job's budget grew.
    timeout-minutes: 45

    steps:
      - name: Check out the branch under test
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24 (Active LTS)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies from the lockfile
        run: npm ci

      # Keyed on the pinned Playwright version: bumping tests/browser-requirements.txt
      # is exactly when a different Chromium build must be fetched.
      - name: Restore the Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser-requirements.txt') }}

      - name: Provision the browser test runtime
        run: npm run setup:browser-tests

      - name: Report what will actually run
        run: npm run check:browser-setup

      # CINEBRAID_BROWSER_REQUIRED is set by the gate itself, so a runner without a
      # working browser fails here instead of reporting a green run over zero
      # browser assertions - which is the failure this whole job exists to prevent.
      - name: Run the real-browser gate
        run: npm run check:browser-gate

      # The O8 authority write seam's mandatory Chromium gate. It lives HERE and not
      # in check:ci for one reason: tests/run-authority-browser-gate.js is documented
      # as "a missing Python/Playwright/Chromium runtime is a gate failure, never a
      # skip", and windows-validation never provisions that runtime -- only this job
      # does. In check:ci it was therefore red on every hosted runner regardless of
      # the product, which is a gate that reports nothing rather than a gate that
      # protects something. Nothing about the gate itself was weakened to move it.
      - name: Run the O8 authority write seam browser gate
        run: npm run check:authority-browser
