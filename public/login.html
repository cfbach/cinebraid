<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — CineBraid</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="/cinebraid-mark.svg">
<link rel="stylesheet" href="styles.css">
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:linear-gradient(180deg,rgba(16,38,62,.96),rgba(8,27,48,.96));border:1px solid rgba(34,211,238,.24);border-radius:22px;padding:34px 34px;width:min(390px,92vw);box-shadow:0 24px 80px rgba(0,0,0,.35)}
.login-brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}.login-brand img{height:52px;width:auto;object-fit:contain}.login-brand .wordmark{font-size:22px}.login-tag{font:800 8px var(--mono);letter-spacing:.17em;color:var(--acc);text-transform:uppercase}
.login-box input{margin:8px 0 14px}
.login-box .lock-btn{width:100%}
.login-err{color:var(--red);font-family:var(--mono);font-size:11px;margin-top:10px;min-height:14px}
</style></head>
<body><div class="login-wrap"><form class="login-box" onsubmit="go(event)">
  <div class="login-brand"><img src="/cinebraid-logo-xs.png" alt="" width="80" height="103"><div><div class="login-tag">YOUR PRODUCTION, YOUR CONTROL</div><div class="wordmark">Cine<span class="wm-accent">Braid</span></div></div></div>
  <label class="form-field"><span style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint)">PASSCODE</span>
  <input id="pass" type="password" autofocus autocomplete="current-password"></label>
  <button class="lock-btn add-btn" type="submit">ENTER CINEBRAID</button>
  <div class="login-err" id="err"></div>
</form></div>
<script>
async function go(e){e.preventDefault();
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:document.getElementById('pass').value})});
  const d = await r.json();
  if(!r.ok){document.getElementById('err').textContent = d.error||'Wrong passcode';return;}
  location.href = d.role==='viewer' ? '/bible.html' : '/';
}
</script><div class="maker-line">CineBraid · by Frombach Studios</div></body></html>
