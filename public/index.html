<body>
<div id="app">
  <aside id="rail">
    <div class="rail-head">
      <div class="brand-lockup">
        <img src="/cinebraid-logo-xs.png" alt="CineBraid" class="brand-logo" width="80" height="103">
        <div class="brand-copy">
          <div class="brand-kicker">YOUR PRODUCTION, YOUR CONTROL</div>
          <div class="wordmark">Cine<span class="wm-accent">Braid</span></div>
        </div>
      </div>
      <!-- A2 — ONE OWNER FOR "WHICH PROJECT AM I IN?". The title is the button, the
           format is the subtitle a filmmaker can act on, and the menu is the small set
           of things the product can already truthfully do to a project. All three are
           static markup for the same reason the rest of the shell is: the page script
           owns their STATE and never their existence. The menu ships empty and hidden;
           renderProjectMenu() fills it from the project that is actually open. -->
      <div class="project-owner">
        <button id="project-title" class="project-title" type="button" aria-expanded="false" aria-controls="project-menu" aria-label="Open the project menu">Projects</button>
        <div id="project-format" class="project-format">Opening…</div>
        <!-- A DISCLOSURE, NOT role="menu". It would be one if it held only commands,
             but the two most useful things in it are not commands: the head names the
             open project in full (the button above it clamps a long title to three
             lines), and the foot names the application and its build. Inside a
             role="menu" a screen reader is entitled to announce only the menuitems,
             which would hide exactly the two facts A2 exists to make legible. So it
             is a labelled group of ordinary buttons, opened and closed by
             aria-expanded, with arrow-key roving added on top as a convenience. -->
        <div id="project-menu" class="project-menu" role="group" aria-labelledby="project-title" hidden></div>
      </div>
    </div>
    <nav id="nav" aria-label="Primary navigation">
      <div class="nav-group">
        <button data-view="production" data-label="Production" class="nav-btn active"><span class="nav-icon">✓</span><span>Production</span><span id="production-nav-count" class="nav-count hidden">0</span></button>
        <button data-view="shots" data-label="Shots" class="nav-btn"><span class="nav-icon">▦</span><span>Shots</span></button>
        <button data-view="library" data-label="References" class="nav-btn"><span class="nav-icon">◆</span><span>References</span></button>
        <button data-view="results" data-label="Generated Media" class="nav-btn"><span class="nav-icon">◎</span><span>Generated Media</span></button>
        <a href="/bible.html" target="_blank" class="nav-btn nav-link"><span class="nav-icon">▤</span><span>Project Bible</span><span class="nav-external">↗</span></a>
        <button data-view="reports" data-label="Reports" class="nav-btn"><span class="nav-icon">▥</span><span>Reports</span></button>
        <button data-view="settings" data-label="Settings" class="nav-btn"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </div>
    </nav>
    <div class="rail-foot">
      <div id="tally" class="tally"></div>
      <button id="rescan" class="ghost-btn">Sync local folders</button>
      <button id="test-note" class="ghost-btn test-note-button" type="button" onclick="openTestNote()">Leave feedback</button>
      <div class="foot-note">Your production, your control. Sync only when files were added outside CineBraid. Records autosave.</div>
      <div class="foot-note brand-note">Production truth · Frombach Studios</div>
      <!-- A2 — THE APPLICATION VERSION, WHERE AN APPLICATION VERSION BELONGS: quiet, at
           the bottom, and nowhere near the project title. It ships saying only the
           product name, because until /api/app-identity answers, a version is not
           something this page knows, and a placeholder number would be a guess. -->
      <div id="app-identity" class="foot-note app-identity">CineBraid</div>
    </div>
  </aside>

  <!-- The creator workspace shell. Its four regions are static markup for the same
       reason #rail, #topbar and #main always have been: a region that JavaScript
       creates is a region JavaScript can create twice, and everything the Assistant,
       the Activity Terminal and the stage strip rely on starts with these nodes
       being the same nodes after a stage change. public/workspace-shell.js owns
       their STATE and never their existence. Every slot ships empty and collapsed;
       public/creator-surfaces.js fills the rail and the dock, and
       public/stage-surfaces.js fills the bar. -->
  <section id="workspace">
    <header id="topbar">
      <div class="topbar-context">
        <button id="mobile-nav" class="topbar-icon" aria-label="Toggle navigation">☰</button>
        <div>
          <div id="topbar-project" class="topbar-project">—</div>
          <div id="topbar-view" class="topbar-view">Production truth workspace</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="global-add" class="topbar-add" type="button">＋ Add</button><button id="automation-activity-toggle" class="automation-activity-toggle" type="button" aria-label="Open automation activity"><span>◉</span><b>Activity</b></button><button id="creator-rail-toggle" class="creator-rail-toggle" type="button" hidden disabled aria-expanded="false" aria-controls="cb-shell-rail" aria-label="Toggle the Assistant rail" onclick="window.CineBraidCreatorSurfaces&&window.CineBraidCreatorSurfaces.toggleRail()"><span aria-hidden="true">◨</span><b>Assistant</b></button><div id="activity-live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div><div id="save-state" class="save-state" data-state="loading"><span class="save-dot"></span><span>Opening…</span></div>
        <div class="topbar-search"><input id="global-search" aria-label="Search canon" placeholder="Search canon"><kbd>/</kbd></div>
        
      </div>
    </header>
    <div id="cb-shell-bar" class="cb-shell-slot" data-shell-slot="bar" aria-label="Shot workflow"><div class="cb-shell-slot-body"></div></div>
    <div id="cb-shell-main" class="cb-shell-main">
      <main id="main"></main>
      <aside id="cb-shell-rail" class="cb-shell-slot" data-shell-slot="rail" aria-label="Assistant"><div class="cb-shell-slot-body"></div></aside>
    </div>
    <div id="cb-shell-dock" class="cb-shell-slot" data-shell-slot="dock" aria-label="Activity terminal"><div class="cb-shell-slot-body"></div></div>
  </section>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="shared-returned-review.js?v=6.7.0-dev.1"></script>
