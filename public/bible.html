<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineBraid · Approved record</title><link rel="icon" href="/cinebraid-mark.svg"><link rel="stylesheet" href="/styles.css">
<style>
/* EV2-7 Approved record as a paper publication on the dark shell. Styles stay inline: a separate stylesheet is outside the viewer's allowed paths. Local serif stack only. */
:root{--rec-paper:#f4f1e9;--rec-ink:#23261f;--rec-muted:#5b6159;--rec-rule:#d3ccbc;--rec-seal:#2f6b45;--rec-link:#0b5f64;--rec-serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Cambria,'Times New Roman',serif;--rec-mono:ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace}
body{margin:0;background:#101618;color:#edf1ed;font:16px/1.6 var(--body,system-ui)}
.record-brand{box-sizing:border-box;max-width:1120px;margin:auto;padding:24px 0 20px}.record-brand img{height:40px;width:auto;object-fit:contain}
#record{box-sizing:border-box;max-width:1120px;margin:0 auto 48px;padding:clamp(24px,5vw,64px);background:var(--rec-paper);color:var(--rec-ink);border-top:6px solid var(--rec-seal);border-radius:3px;overflow-wrap:anywhere}
#record a{color:var(--rec-link);text-underline-offset:3px}
#record .record-head{display:block;margin:0;padding-bottom:28px;border-bottom:1px solid var(--rec-rule)}
.record-kicker{margin:0;color:var(--rec-seal);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.record-head h1{margin:12px 0 6px;font-family:var(--rec-serif);font-size:clamp(32px,4.4vw,52px);line-height:1.1}
.record-format{margin:0 0 18px;color:var(--rec-muted)}
.record-standfirst{max-width:62ch;margin:0 0 20px;font:19px/1.7 var(--rec-serif)}
.record-links{display:flex;flex-wrap:wrap;gap:4px 24px}.record-links a{display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.record-find{margin:28px 0 0}.record-find label{display:block;margin-bottom:6px;font-size:14px;font-weight:600}
#record-search{display:block;box-sizing:border-box;width:100%;min-height:44px;margin:0;padding:10px 12px;background:#fffdf8;color:var(--rec-ink);border:1px solid #7b8479;border-radius:6px;font:16px var(--body,system-ui)}
#record-count{margin:8px 0 0;color:var(--rec-muted);font-size:14px}
.record-section{margin:36px 0 0;padding-top:28px;border-top:1px solid var(--rec-rule)}
.record-kind{margin:0;color:var(--rec-muted);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.record-section h2{margin:6px 0 0;font-family:var(--rec-serif);font-size:30px;line-height:1.2}
.record-id{margin:4px 0 20px;color:var(--rec-muted);font:13px/1.5 var(--rec-mono)}
.record-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.record-target{box-sizing:border-box;min-width:0;padding:20px;background:#fffdf8;border:1px solid var(--rec-rule);border-radius:6px}
.record-target h3{margin:0 0 2px;font-family:var(--rec-serif);font-size:21px;line-height:1.3}
.record-approved{margin:0 0 12px;color:var(--rec-seal);font-size:14px;font-weight:600}
.record-target img,.record-target video{display:block;width:100%;height:240px;object-fit:contain;background:#e6e0d3;border-radius:4px}.record-target audio{width:100%}
.record-source{margin-top:10px;color:var(--rec-muted);font-size:13px}.record-source summary{box-sizing:border-box;min-height:44px;padding:11px 0;cursor:pointer}.record-source small{display:block;font-size:13px;line-height:1.5}
.record-empty{margin-top:32px}.record-empty h2,.record-error h1{margin:0 0 8px;font-family:var(--rec-serif);font-size:30px;line-height:1.2}.record-empty p,.record-error p{max-width:62ch;font:18px/1.7 var(--rec-serif)}
#record button{min-height:44px;padding:0 16px;background:transparent;color:#334d4b;border:1px solid #8f9c94;border-radius:8px;font:inherit;cursor:pointer}
#record :is(a,button,input,summary):focus-visible{outline:3px solid #0a6d72;outline-offset:3px}
@media(max-width:1152px){.record-brand{padding:20px 16px}#record{margin:0 16px 32px}}
@media(max-width:700px){.record-standfirst{font-size:17px}.record-section h2{font-size:26px}.record-target{padding:16px}}
</style></head><body><header class="record-brand"><img src="/cinebraid-logo-xs.png" width="80" height="103" alt="CineBraid"></header><main id="record" aria-busy="true"><p role="status">Loading Approved record…</p></main><script src="/bible.js"></script></body></html>
